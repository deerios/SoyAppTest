name: soybot

on:
  schedule:
    # Every 15 minutes. Keep this interval reasonable so we don't hammer
    # Discord/Reddit/YouTube, and so overlapping runs stay rare.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: soybot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run soybot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python app.py

      - name: Commit updated state
        run: |
          git config user.name "soybot"
          git config user.email "soybot@users.noreply.github.com"
          git add state.json posted_videos.json queue.json
          git diff --cached --quiet || git commit -m "Update state"
          git push
